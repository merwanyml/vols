name: Chercher les offres de vols

on:
  schedule:
    # 4 lancements par jour (heures UTC : 6h, 12h, 18h et minuit, heure de Paris en été)
    - cron: "0 4,10,16,22 * * *"
  workflow_dispatch:       # permet de le lancer à la main (bouton "Run workflow")
    inputs:
      test_notification:
        description: "Envoyer une notification de test"
        type: boolean
        default: false

permissions:
  contents: write

# un seul lancement à la fois (évite les conflits sur l'historique)
concurrency:
  group: vols
  cancel-in-progress: false

jobs:
  chercher:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Lancer la recherche
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NTFY_TEST: ${{ inputs.test_notification && '1' || '0' }}
        run: python search.py
      - name: Sauvegarder l'historique des prix
        if: always()
        run: |
          git config user.name "vols-bot"
          git config user.email "vols-bot@users.noreply.github.com"
          git add history.json notified.json vus.json || true
          git diff --cached --quiet || (git commit -m "Mise à jour de l'historique" && git pull --rebase && git push)
