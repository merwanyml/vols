# ============================================================
#  COURT COURRIER : week-ends et courts séjours de vacances
#  depuis Lille, Charleroi et Beauvais
#  (le long courrier a son propre fichier : config_long.yaml)
# ============================================================

# Lille : LIL | Bruxelles-Charleroi : CRL | Paris-Beauvais : BVA | Paris-Roissy : CDG
aeroports_week_end: [LIL, CRL, BVA, CDG]

week_end:
  actif: true
  nb_semaines: 12              # combien de semaines à l'avance on regarde
  departs: [jeudi, vendredi]   # jours de départ possibles
  retours: [dimanche]          # retour toujours le dimanche
  # Ton emploi du temps de janvier est inconnu : à partir de cette date, un retour le lundi
  # est aussi accepté. Pour ne jamais revenir un lundi, supprime ces 3 lignes.
  retours_supplementaires:
    a_partir_du: "2027-01-01"
    jours: [lundi]
  directs_seulement: true      # seulement les vols directs (sans escale)
  # Horaires voulus. Pour les désactiver, supprime tout le bloc "horaires".
  # L'aller est filtré directement. Le retour est vérifié seulement quand une offre
  # est trouvée (l'heure du retour n'apparaît pas dans la recherche aller-retour).
  horaires:
    depart:
      jeudi:    {apres: "19:00"}   # jeudi soir tard
      vendredi: {avant: "12:00"}   # vendredi matin
    retour:
      dimanche: {apres: "17:00"}   # dimanche soir
  # false : une offre sans retour dimanche soir est quand même signalée, avec un avertissement
  # true : elle n'est pas signalée du tout
  retour_strict: false
  # Les destinations sont celles de la section "zones" ci-dessous.
  # Pour en ajouter une : mets son code dans la zone qui correspond
  # (et son nom français dans noms.py).
  prix_max_alerte: 60          # utilisé seulement pour une destination absente des zones

# Courts séjours pendant tes vacances de fin d'année : quelques nuits, n'importe quels jours
# de la période, vols directs, sans contrainte d'horaire. Mêmes destinations et mêmes plafonds
# que les week-ends. Pour les désactiver : actif: false.
vacances_court:
  actif: true
  debut: "2026-12-24"
  fin: "2027-01-04"
  durees: [2, 3]               # nombre de nuits (3 jours = 2 ou 3 nuits)
  pas_jours: 1                 # un départ chaque jour
  directs_seulement: true
  prix_max_alerte: 60          # utilisé seulement pour une destination absente des zones

# Destinations dont l'intérêt est surtout la plage ou la chaleur : mises en pause pour l'hiver.
# Elles reprennent TOUTES SEULES à la date indiquée. Pour les remettre plus tôt, change la date.
destinations_en_pause:
  jusqu_au: "2027-02-15"
  codes: [
    RAK, AGA, FEZ, TNG, CMN, TUN, DJE, MIR, OZZ, ESU,   # tout le Maghreb
    IBZ, PMI, CFU, RHO, HER, CHQ, SPU, CAG, BDS, BRI,   # plages d'été
  ]

# Plafond propre à une destination (prioritaire sur celui de sa zone). Utile pour une destination
# qui revient trop souvent : baisse son plafond ici.
plafonds_destination:
  MAN: 40

# --- Destinations et plafonds d'alerte, selon la DISTANCE ---
# Si l'aller-retour passe sous le plafond de sa zone, tu es prévenu tout de suite,
# même sans historique. Ce sont des estimations à ajuster selon ce que tu vois passer.
zones:
  - nom: Europe proche
    plafond: 60
    destinations: [
      BCN, GRO, MAD, VLC, ALC, AGP, SVQ, GRX, BIO, SCQ, PMI, IBZ, LIS, OPO,
      FCO, CIA, MXP, BGY, VCE, TSF, VRN, BLQ, PSA, NAP, TRN,
      BER, VIE, PRG, BUD, WAW, KRK, GDN, WRO, POZ, KTW, BTS, LJU, ZAG, CPH,
      STN, LTN, LGW, MAN, EDI, DUB, ORK, BRS, NCE,
      # ajouts pour l'hiver (villes du nord et de l'est, marchés de Noël, Royaume-Uni)
      DUS, CGN, HAM, MUC, FRA, NUE, BSL, SZG, INN,
      BHX, LPL, NCL, GLA, BFS, LBA, EMA, CWL, SNN, BLL,
      TRS, FLR, GOA, REU, ZAZ, VGO, JRZ, LEI, SZZ, RZE, BRQ, KSC,
    ]
  - nom: Europe éloignée
    plafond: 90
    destinations: [
      FAO, BRI, BDS, CTA, PMO, CAG, SPU, DBV,
      OSL, ARN, HEL, TLL, RIX, VNO,
      ATH, SKG, CFU, RHO, HER, CHQ, MLA, TIA, SOF, OTP, BEG, SJJ, SKP, IST, SAW,
      # ajouts pour l'hiver
      CLJ, TSR, IAS, SBZ, PRN, TGD, TIV, KIV, KUN,
      NYO, TRF, BGO, GOT, MMX, TOS, RVN,
    ]
  - nom: Îles lointaines
    plafond: 120
    destinations: [TFS, LPA, ACE, FUE, FNC, LCA, PFO, KEF, PDL, SPC, TFN]
  - nom: Maghreb
    plafond: 70
    destinations: [RAK, AGA, FEZ, TNG, CMN, TUN, DJE, MIR, OZZ, ESU]
  # Soleil en plein hiver (20 à 25 °C en décembre) : Égypte (mer Rouge), Cap-Vert, Jordanie
  - nom: Soleil d'hiver
    plafond: 150
    destinations: [HRG, SSH, RMF, SID, BVC, AQJ]

# --- Comment l'outil juge qu'un prix est une bonne affaire --
# Court courrier : uniquement les plafonds de la section "zones" ci-dessus.
detection:
  baisse_vs_historique: false   # pas de comparaison avec le prix habituel
  utiliser_avis_google: false
  # Record : l'outil retient le meilleur prix jamais relevé sur chaque route
  # (depuis le début du script) et te prévient quand un vol l'égale, le bat
  # ou s'en approche de quelques euros.
  record_prix:
    actif: true
    echantillon_minimum: 15     # relevés nécessaires sur la route avant de parler de "record"
    marge_euros: 5              # alerte si le prix est à moins de 5 € du minimum enregistré
    garde_fou_x_plafond: 1.5    # pas d'alerte record si le prix dépasse 1,5 × le plafond de la zone

# --- Limites techniques (PAR LANCEMENT, il y en a 3 par jour) --
limites:
  # L'outil s'arrête à la première de ces deux limites.
  recherches_max: 1500
  duree_max_minutes: 140
  # Pause entre deux recherches, tirée au hasard entre ces deux valeurs (en secondes).
  # Plus c'est lent, moins Google nous remarque : le temps d'exécution n'a pas d'importance.
  pause_secondes: [2.0, 4.5]
  # Arrêt si autant d'échecs d'affilée (signe que Google nous freine)
  echecs_consecutifs_max: 25
  # Une route sans aucun vol 3 fois de suite est mise de côté 30 jours
  routes_vides_avant_pause: 3
  routes_vides_jours_pause: 30
  part_week_end: 1.0
  # Part des recherches consacrée aux séjours de vacances (24/12 → 04/01) tant qu'ils existent.
  part_vacances: 0.25
  max_notifications: 8
