name: Bilan de la semaine

on:
  schedule:
    # chaque dimanche à 17h UTC (environ 19h à Paris)
    - cron: "0 17 * * 0"
  workflow_dispatch:       # permet de le lancer à la main (bouton "Run workflow")

permissions:
  contents: write

jobs:
  bilan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fabriquer le bilan
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python bilan.py
      - name: Sauvegarder le rapport
        run: |
          git config user.name "vols-bot"
          git config user.email "vols-bot@users.noreply.github.com"
          git add data/bilans || true
          git diff --cached --quiet || (git commit -m "Bilan hebdomadaire" && git pull --rebase && git push)
