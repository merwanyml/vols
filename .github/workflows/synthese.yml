name: Page de recherche des offres

on:
  # la page est reconstruite dès qu'un lancement de recherche ou de vérification se termine
  workflow_run:
    workflows: ["Court courrier (week-ends)", "Long courrier (avril, été)", "Vérification des prix"]
    types: [completed]
  schedule:
    # filet de sécurité : une fois par jour (heure UTC)
    - cron: "30 6 * * *"
  workflow_dispatch:       # permet de le lancer à la main (bouton "Run workflow")

permissions:
  contents: write

# une seule reconstruction à la fois (évite les conflits quand deux lancements finissent ensemble)
concurrency:
  group: vols-synthese
  cancel-in-progress: false

jobs:
  page:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fabriquer la page
        run: python synthese.py
      - name: Sauvegarder la page
        run: |
          git config user.name "vols-bot"
          git config user.email "vols-bot@users.noreply.github.com"
          git add data/synthese || true
          git diff --cached --quiet || (git commit -m "Page de recherche" && git pull --rebase && git push)
