name: Vérification des prix

on:
  schedule:
    # 4 fois par jour (heures UTC)
    - cron: "40 1,7,13,19 * * *"
  workflow_dispatch:       # permet de le lancer à la main (bouton "Run workflow")

permissions:
  contents: write

concurrency:
  group: vols-verif
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Revérifier les offres du site
        run: python verifier.py
      - name: Sauvegarder les vérifications
        if: always()
        run: |
          git config user.name "vols-bot"
          git config user.email "vols-bot@users.noreply.github.com"
          git add data/verifications || true
          git diff --cached --quiet || (git commit -m "Vérification des prix" && git pull --rebase && git push)
