# ============================================================
#  LONG COURRIER : longs séjours dans le monde depuis Paris, Bruxelles, Amsterdam
#  (le court courrier / week-ends a son propre fichier : config_court.yaml)
# ============================================================

# Paris-Roissy (CDG), Paris-Orly (ORY), Bruxelles-Zaventem (BRU), Amsterdam-Schiphol (AMS)
aeroports_long_courrier: [CDG, ORY, BRU, AMS]

# Part des recherches par aéroport de départ : 1 = normal, 0.4 = environ 2,5 fois moins souvent.
# Amsterdam est plus loin, donc cherché moins souvent que Paris et Zaventem.
poids_aeroports: {CDG: 1, ORY: 1, BRU: 1, AMS: 0.4}

# Le départ ET le retour doivent tenir dans la période.
# Pense à mettre à jour les dates chaque année.
# "reperes" : dates testées en permanence pour surveiller chaque route (voir "reperage" plus bas).
long_sejour:
  actif: true
  directs_seulement: false     # escales acceptées (indispensable pour le long courrier)
  periodes:
    - nom: Avril
      debut: "2027-04-10"
      fin: "2027-04-25"
      durees: [5, 7, 10]
      pas_jours: 1             # un départ chaque jour
      reperes: {durees: [7], pas_jours: 4}
    - nom: Été
      debut: "2027-07-01"
      fin: "2027-08-31"
      durees: [7, 14, 21]
      pas_jours: 3             # un départ tous les 3 jours
      reperes: {durees: [14], pas_jours: 8}
    - nom: Noël
      debut: "2026-12-24"
      fin: "2027-01-04"
      durees: [5, 7, 9]
      pas_jours: 1
      reperes: {durees: [7], pas_jours: 2}
  prix_max_alerte: 400         # utilisé seulement pour une destination absente des zones

# --- Repérage puis zoom -------------------------------------------------------
# Avec ~120 destinations, tester toutes les dates de toutes les routes prendrait des semaines.
# L'outil fait donc deux choses :
#   1. repérage : il surveille chaque route avec quelques dates seulement (les "reperes" ci-dessus)
#   2. zoom : si un repère tombe sous (zoom_si_sous_x_plafond × plafond de la zone), il teste
#      ensuite TOUTES les dates de cette route/période pendant "zoom_jours" jours, pour dénicher
#      la meilleure date.
# Pour revenir à "toutes les dates partout" : actif: false.
reperage:
  actif: true
  zoom_si_sous_x_plafond: 1.4  # 1.4 = un prix jusqu'à 40 % au-dessus du plafond déclenche le zoom
  zoom_jours: 10
  part_zoom: 0.4               # part maximale des recherches consacrée au zoom

# Destinations mises en pause : elles reprennent TOUTES SEULES à la date indiquée.
destinations_en_pause:
  jusqu_au: "2027-02-15"
  codes: [CMN, RAK, TUN, AGA, TNG, FEZ, DJE, ALG, ORN]   # tout le Maghreb

# --- Destinations et plafonds d'alerte, selon la DISTANCE (pas la durée) ---
# Si l'aller-retour passe sous le plafond de sa zone, tu es prévenu tout de suite.
# Pour ajouter une destination : mets son code dans la zone qui correspond
# (et son nom français dans noms.py, son prix d'hôtel dans couts.py).
zones:
  - nom: Maghreb
    plafond: 70
    destinations: [CMN, RAK, TUN, AGA, TNG, FEZ, DJE, ALG, ORN]
  - nom: Égypte, Proche-Orient et Golfe
    plafond: 300
    destinations: [CAI, DXB, DOH, HRG, SSH, AUH, MCT, AMM, TBS, EVN, GYD]
  - nom: Afrique
    plafond: 400
    destinations: [DSS, ABJ, ACC, DLA, LOS, ADD, DAR, JRO, SID]
  - nom: Amérique du Nord (côte est)
    plafond: 350
    destinations: [JFK, YUL, MIA, BOS, IAD, PHL, YYZ, YQB, YHZ]
  - nom: Amérique du Nord (intérieur et ouest)
    plafond: 450
    destinations: [ORD, ATL, MCO, DFW, IAH, DEN, LAS, SFO, SEA, YVR]
  - nom: Très long courrier
    plafond: 500
    destinations: [
      # déjà surveillées
      LAX, MEX, CUN, BKK, SGN, HAN, SIN, KUL, DPS, TYO, ICN, DEL, BOM, CPT, NBO,
      ZNZ, MRU, RUN, PTP, FDF, PUJ, HAV, GRU, EZE, LIM, BOG,
      # Asie
      MNL, CEB, HKG, TPE, PEK, PVG, OSA, CGK, HKT, CNX, REP, PNH, USM, DAD, PQC,
      BLR, MAA, CMB, MLE, KTM, TAS, ALA,
      # Afrique australe et océan Indien
      JNB, TNR, SEZ,
      # Caraïbes et Amérique centrale et du Sud
      SJU, BGI, MBJ, NAS, SXM, SDQ, CTG, MDE, PTY, SJO, GUA, SCL, MVD, UIO, GIG, SSA, REC, FOR,
    ]
  - nom: Océanie et Pacifique
    plafond: 900
    destinations: [SYD, MEL, BNE, PER, AKL, NOU, HNL]
  - nom: Polynésie
    plafond: 1000
    destinations: [PPT]

# --- Comment l'outil juge qu'un prix est une bonne affaire --
# Long courrier : uniquement (1) les plafonds des zones et (2) une VRAIE baisse sous le record
# enregistré. L'ancien critère « X % moins cher que d'habitude » est supprimé : il signalait des
# vols à 800 € « parce que d'habitude c'est 1500 € », ce qui n'est pas une bonne affaire.
detection:
  baisse_vs_historique: false
  utiliser_avis_google: false
  # Record : le meilleur prix jamais relevé sur chaque route ET chaque période (avril, été, Noël).
  record_prix:
    actif: true
    echantillon_minimum: 15     # relevés nécessaires sur la route avant de parler de "record"
    baisse_minimum_pct: 8       # il faut battre l'ancien record d'au moins 8 % (une vraie baisse)
    garde_fou_x_plafond: 1.5    # pas d'alerte record si le prix dépasse 1,5 × le plafond de la zone

# --- Limites techniques (PAR LANCEMENT, il y en a 3 par jour) --
limites:
  # L'outil s'arrête à la première de ces deux limites.
  recherches_max: 1000
  duree_max_minutes: 110
  # Pause entre deux recherches, tirée au hasard entre ces deux valeurs (en secondes).
  # Plus c'est lent, moins Google nous remarque : le temps d'exécution n'a pas d'importance.
  pause_secondes: [2.0, 4.5]
  # Arrêt si autant d'échecs d'affilée (signe que Google nous freine)
  echecs_consecutifs_max: 25
  # Une route sans aucun vol 3 fois de suite est mise de côté 30 jours
  routes_vides_avant_pause: 3
  routes_vides_jours_pause: 30
  max_notifications: 8
